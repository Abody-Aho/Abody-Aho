name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  snake:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Abody-Aho
          outputs: |
            snake/github-snake.svg?palette=github-light
            snake/github-snake-dark.svg?palette=github-dark&color_snake=00C897

      - name: Commit Snake
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add snake/

          git diff --cached --quiet || git commit -m "chore: update contribution snake"

          git push
